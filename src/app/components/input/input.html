<mat-form-field appearance="outline" class="full-width">
    <input
      matInput
      [type]="type"
      [placeholder]="placeholder"
      [disabled]="disabled"
      [required]="required"
      [value]="value"
      (input)="onChange($event.target.value)"
      (blur)="onTouched()"
    >
  </mat-form-field>
